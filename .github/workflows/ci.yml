name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest hypothesis
          pip install -e packages/sv_core
          pip install -e packages/sv_engine
          pip install -e packages/sv_fusion
          pip install -e packages/sv_receipts
          pip install -e services/api

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checks
        run: |
          mypy packages/ services/api/ --ignore-missing-imports

      - name: Run Pytest (Mock Mode)
        run: |
          pytest -v -m "not gpu"

      - name: Check No Hardcoded Metric Literals
        run: |
          python3 tools/check_no_metric_literals.py web/src services/
