[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_api"
version = "0.1.0"
description = "SENTINEL-V FastAPI Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sv_core",
    "sv_engine",
    "sv_fusion",
    "sv_receipts",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
