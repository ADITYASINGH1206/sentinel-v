[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_monitor"
version = "0.1.0"
description = "SENTINEL-V Statistical Drift Monitoring, Recalibration & Retention Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sv_core",
    "sv_engine",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
