[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_workers"
version = "0.1.0"
description = "SENTINEL-V Distributed Celery Task Workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sv_core",
    "sv_engine",
    "sv_fusion",
    "sv_receipts",
    "celery[redis]>=5.4.0",
    "boto3>=1.34.0"
]

[tool.setuptools.packages.find]
where = ["src"]
