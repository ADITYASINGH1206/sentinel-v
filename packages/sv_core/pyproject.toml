[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_core"
version = "0.1.0"
description = "SENTINEL-V Core Schemas, Settings, and Utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "rfc8785>=0.1.2",
    "structlog>=24.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

