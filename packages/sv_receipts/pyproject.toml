[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_receipts"
version = "0.1.0"
description = "SENTINEL-V Cryptographic Detection Receipts and Merkle Trees"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sv_core",
    "cryptography>=42.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

