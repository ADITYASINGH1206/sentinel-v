[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv_engine"
version = "0.1.0"
description = "SENTINEL-V Deepfake Detection Engine & Adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sv_core",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9.0",
    "av>=12.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
    "timm>=0.9.0",
    "scikit-learn>=1.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
