# VeriFrame console: static SPA + reverse proxy to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /demo/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # API, compatibility endpoint, health and published keys go to the FastAPI service.
    location ~ ^/(v1|compat|readyz|healthz|\.well-known)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (analysis progress) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 500m;
    }

    # Client-side routes (BrowserRouter) fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
