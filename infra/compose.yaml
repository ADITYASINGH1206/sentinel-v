services:
  postgres:
    image: postgres:16-alpine
    container_name: sv-postgres
    environment:
      POSTGRES_DB: sv
      POSTGRES_USER: sv
      POSTGRES_PASSWORD: sv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv -d sv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: sv-api
    ports:
      - "8080:8080"
    environment:
      SV_ENV: dev
      SV_ENGINE_MODE: mock
      SV_DATABASE_URL: postgresql+asyncpg://sv:sv@postgres:5432/sv
      SV_REDIS_URL: redis://redis:6379/0
      SV_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-cpu:
    build:
      context: ..
      dockerfile: infra/docker/worker-cpu.Dockerfile
    container_name: sv-worker-cpu
    environment:
      SV_ENV: dev
      SV_ENGINE_MODE: mock
      SV_DATABASE_URL: postgresql+asyncpg://sv:sv@postgres:5432/sv
      SV_REDIS_URL: redis://redis:6379/0
      SV_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: sv-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
