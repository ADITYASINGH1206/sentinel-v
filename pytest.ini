[pytest]
testpaths = 
    packages
    services
    eval
    tests
norecursedirs = 
    third_party
    node_modules
    .git
pythonpath = 
    packages/sv_core/src
    packages/sv_engine/src
    packages/sv_fusion/src
    packages/sv_receipts/src
    services/api/src
    services/workers/src
    services/monitor/src
markers =
    gpu: marks tests as requiring GPU acceleration (deselect with '-m "not gpu"')
