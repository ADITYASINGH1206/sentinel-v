<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriFrame — calibrated video deepfake screening</title>
    <meta
      name="description"
      content="VeriFrame screens faces in video with the S-MSDT detector family and returns a calibrated score, an evidence map, a decision band you control, and a signed receipt anyone can verify."
    />
    <meta name="theme-color" content="#070B12" />
    <meta property="og:title" content="VeriFrame — calibrated video deepfake screening" />
    <meta
      property="og:description"
      content="Calibrated scores, evidence maps, and verifiable receipts for video deepfake screening."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('vf.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
